services:

  db:
    image: mysql:8.0
    container_name: prestashop-db

    command: --default-authentication-plugin=mysql_native_password

    restart: unless-stopped

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop

    volumes:
      - mysql_data:/var/lib/mysql

  prestashop:
    image: prestashop/prestashop:9.1.4
    container_name: prestashop

    depends_on:
      - db

    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      # ---------- Database ----------
      DB_SERVER: db
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin

      # ---------- Automatic installation ----------
      PS_INSTALL_AUTO: 1
      PS_INSTALL_DB: 1
      PS_ERASE_DB: 1

      # ---------- URLs ----------
      PS_DOMAIN: localhost:8080

      # ---------- Folders ----------
      PS_FOLDER_ADMIN: admin_test
      PS_FOLDER_INSTALL: install_test

      # ---------- Demo data ----------
      PS_DEMO_MODE: 0

      # ---------- Admin ----------
      ADMIN_MAIL: admin@example.com
      ADMIN_PASSWD: Admin1357!

      # ---------- Language ----------
      PS_LANGUAGE: en
      PS_COUNTRY: GB

    volumes:
      - psdata:/var/www/html

volumes:
  mysql_data:
  psdata:
